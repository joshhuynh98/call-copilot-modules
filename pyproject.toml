[project]
name = "callcopilot"
version = "0.1.0"
description = "Live Call Copilot modules: meeting summary, email wrap-up, chatbot, recommendation spec + evals"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.0"]  # mcp: only to test our MCP client against the official SDK server
browser = ["playwright>=1.40"]  # optional: lets the docs reader fall back to a real browser for JavaScript pages

[project.scripts]
callcopilot = "callcopilot.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
callcopilot = ["**/prompts/**/*.md", "**/data/*.txt", "**/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
