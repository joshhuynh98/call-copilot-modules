[project]
name = "callcopilot"
version = "0.1.0"
description = "Live Call Copilot modules: meeting summary, email wrap-up, chatbot, recommendation spec + evals"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
callcopilot = "callcopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
callcopilot = ["prompts/**/*.md", "data/*.txt", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
